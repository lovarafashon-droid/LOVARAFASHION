<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LOVARA – Orders Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="icon" type="image/jpeg" href="LOVARA.jpeg">

  <!-- Firebase SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="js/firebase-config.js"></script>

  <style>
    :root {
      --primary: #c9a87c;
      --primary-dark: #b8956a;
      --secondary: #1a1a1a;
      --text: #333;
      --text-light: #777;
      --bg: #f5f3f0;
      --white: #fff;
      --border: #e8e4e0;
      --shadow: 0 4px 20px rgba(0,0,0,0.06);
      --radius: 16px;
      --radius-sm: 10px;
      --transition: all 0.3s ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Jost', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }

    .navbar {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
    }
    .nav-container {
      max-width: 1100px; margin: 0 auto; padding: 15px 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif; font-size: 26px;
      font-weight: 600; color: var(--secondary); text-decoration: none; letter-spacing: 2px;
    }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .nav-btn {
      padding: 8px 18px; background: var(--primary); color: #fff;
      border: none; border-radius: 20px; font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none; font-family: 'Jost', sans-serif;
      transition: var(--transition); display: inline-flex; align-items: center; gap: 6px;
    }
    .nav-btn:hover { background: var(--primary-dark); transform: translateY(-1px); }
    .nav-btn.outline { background: transparent; color: var(--secondary); border: 1.5px solid var(--border); }
    .nav-btn.outline:hover { border-color: var(--primary); color: var(--primary); }

    .orders-page { padding: 90px 0 40px; min-height: 100vh; }

    .page-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 30px; flex-wrap: wrap; gap: 15px;
    }
    .page-header h1 {
      font-family: 'Cormorant Garamond', serif; font-size: 36px; color: var(--secondary);
    }
    .page-header p { color: var(--text-light); font-size: 14px; }
    .badge-count {
      background: var(--primary); color: #fff; padding: 4px 12px;
      border-radius: 20px; font-size: 13px; font-weight: 600;
    }

    /* Loading */
    .loading-state {
      text-align: center; padding: 80px 20px; color: var(--text-light);
    }
    .loading-state i { font-size: 40px; color: var(--primary); margin-bottom: 15px; display: block; }
    .loading-state p { font-size: 15px; }

    /* Error / Auth */
    .error-state, .auth-state {
      text-align: center; padding: 80px 20px; max-width: 500px; margin: 0 auto;
    }
    .error-state i, .auth-state i { font-size: 50px; margin-bottom: 20px; display: block; }
    .error-state i { color: #e74c3c; }
    .auth-state i { color: var(--primary); }
    .error-state h3, .auth-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 26px; color: var(--secondary); margin-bottom: 10px; }
    .error-state p, .auth-state p { color: var(--text-light); margin-bottom: 20px; }

    .order-card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 25px; overflow: hidden;
      border: 1px solid var(--border); transition: var(--transition);
    }
    .order-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.1); }

    /* Order Header */
    .order-header {
      background: linear-gradient(135deg, var(--secondary) 0%, #2d2d2d 100%);
      color: #fff; padding: 18px 25px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .order-header-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .order-id {
      font-family: 'Cormorant Garamond', serif; font-size: 20px;
      font-weight: 600; letter-spacing: 1px; color: var(--primary);
    }
    .order-date { font-size: 13px; color: #bbb; }
    .order-status {
      padding: 5px 14px; border-radius: 20px; font-size: 11px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
    }
    .status-pending { background: rgba(201,168,124,0.25); color: #f0d5a8; }
    .status-confirmed { background: rgba(76,175,80,0.25); color: #a5d6a7; }
    .status-shipped { background: rgba(33,150,243,0.25); color: #90caf9; }
    .status-delivered { background: rgba(76,175,80,0.25); color: #a5d6a7; }
    .status-cancelled { background: rgba(192,57,43,0.25); color: #ef9a9a; }

    /* Order Body */
    .order-body { padding: 25px; }

    /* Customer Info Box */
    .customer-box {
      background: #faf8f5; border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 20px; margin-bottom: 25px;
    }
    .box-title {
      font-size: 13px; font-weight: 600; color: var(--secondary);
      text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    .box-title i { color: var(--primary); }

    .info-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
    }
    .info-label { font-size: 11px; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
    .info-value { font-size: 14px; font-weight: 500; color: var(--secondary); }
    .info-value.phone { direction: ltr; display: inline-block; }
    .info-value.highlight { color: var(--primary); font-weight: 600; }

    /* Items Table */
    .items-section { margin-bottom: 25px; }
    .item-card {
      display: flex; align-items: center; gap: 15px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .item-card:last-child { border-bottom: none; }
    .item-img {
      width: 65px; height: 65px; object-fit: cover; border-radius: var(--radius-sm);
      border: 1px solid var(--border); flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-name { font-size: 15px; font-weight: 600; color: var(--secondary); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-tags { display: flex; gap: 12px; flex-wrap: wrap; }
    .item-tag { font-size: 12px; color: var(--text-light); background: var(--bg); padding: 3px 10px; border-radius: 12px; }
    .item-tag i { margin-right: 4px; color: var(--primary); font-size: 10px; }
    .item-total { font-size: 15px; font-weight: 600; color: var(--primary); min-width: 90px; text-align: right; flex-shrink: 0; }

    /* Totals */
    .totals-box {
      background: var(--secondary); color: #fff; border-radius: var(--radius-sm);
      padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;
    }
    .totals-left { display: flex; flex-direction: column; gap: 6px; }
    .totals-left .line { font-size: 13px; color: #aaa; }
    .totals-left .line span { color: #fff; font-weight: 500; margin-left: 8px; }
    .totals-right { text-align: right; }
    .totals-right .label { font-size: 12px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .totals-right .amount { font-size: 24px; font-weight: 600; color: var(--primary); font-family: 'Cormorant Garamond', serif; }

    /* Actions */
    .order-actions {
      padding: 15px 25px; background: #fafafa;
      border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;
    }
    .btn {
      padding: 10px 22px; border-radius: 25px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: var(--transition); font-family: 'Jost', sans-serif;
      border: none; display: inline-flex; align-items: center; gap: 7px; text-decoration: none;
    }
    .btn-whatsapp { background: #25D366; color: #fff; }
    .btn-whatsapp:hover { background: #1da851; transform: translateY(-1px); }
    .btn-delete { background: #fff0f0; color: #c0392b; border: 1px solid #ffcdd2; }
    .btn-delete:hover { background: #c0392b; color: #fff; }
    .btn-call { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; }
    .btn-call:hover { background: #1976d2; color: #fff; }

    /* Empty State */
    .empty-state {
      text-align: center; padding: 100px 20px; color: var(--text-light);
    }
    .empty-state i { font-size: 60px; color: #ddd; margin-bottom: 20px; display: block; }
    .empty-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 28px; color: var(--secondary); margin-bottom: 8px; }
    .empty-state p { margin-bottom: 20px; }

    .footer { background: var(--secondary); color: #888; padding: 25px 0; text-align: center; margin-top: 50px; }
    .footer p { font-size: 13px; }

    @media (max-width: 768px) {
      .orders-page { padding: 80px 0 30px; }
      .page-header h1 { font-size: 28px; }
      .order-header { padding: 15px 20px; }
      .order-body { padding: 18px; }
      .item-card { flex-wrap: wrap; }
      .item-total { width: 100%; text-align: left; margin-top: 5px; }
      .totals-box { flex-direction: column; text-align: center; }
      .totals-right { text-align: center; }
      .order-actions { justify-content: center; }
    }
  </style>

<base target="_blank">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">LOVARA</a>
      <div class="nav-actions">
        <a href="index.html" class="nav-btn outline"><i class="fas fa-home"></i> Home</a>
        <a href="checkout.html" class="nav-btn"><i class="fas fa-shopping-bag"></i> New Order</a>
      </div>
    </div>
  </header>

  <section class="orders-page">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>Orders Dashboard</h1>
          <p>All customer orders synced from the cloud</p>
        </div>
        <span class="badge-count" id="orderCount">0 Orders</span>
      </div>

      <div id="ordersList">
        <!-- Loading State -->
        <div class="loading-state" id="loadingState">
          <i class="fas fa-circle-notch fa-spin"></i>
          <p>Loading orders from cloud...</p>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <p>© 2027 LOVARA. Orders Management Dashboard.</p>
    </div>
  </footer>

  <script>
    const OrdersApp = {
      db: null,
      orders: [],
      unsubscribe: null,

      init() {
        // Wait for Firebase to be ready
        let attempts = 0;
        const check = () => {
          attempts++;
          if (typeof firebase !== 'undefined' && firebase.apps && firebase.apps.length > 0 && firebase.firestore) {
            this.db = firebase.firestore();
            this.setupAuthCheck();
            console.log('[LOVARA Orders] Firebase ready');
          } else if (attempts < 30) {
            setTimeout(check, 300);
          } else {
            console.warn('[LOVARA Orders] Firebase not loaded, falling back to localStorage');
            this.loadFromLocalStorage();
          }
        };
        setTimeout(check, 200);
      },

      setupAuthCheck() {
        firebase.auth().onAuthStateChanged((user) => {
          if (!user) {
            this.showAuthState();
            return;
          }
          // Optional: check if admin
          this.db.collection('users').doc(user.uid).get()
            .then(doc => {
              const role = doc.exists ? doc.data().role : 'user';
              if (role === 'admin') {
                this.loadFromFirestore();
              } else {
                // Allow any logged-in user to view orders (or restrict to admin only)
                this.loadFromFirestore();
              }
            })
            .catch(() => {
              // If can't check role, still load orders (fail-open for now)
              this.loadFromFirestore();
            });
        });
      },

      showAuthState() {
        const container = document.getElementById('ordersList');
        const countBadge = document.getElementById('orderCount');
        countBadge.textContent = '0 Orders';
        container.innerHTML = `
          <div class="auth-state">
            <i class="fas fa-lock"></i>
            <h3>Authentication Required</h3>
            <p>Please sign in to view orders dashboard.</p>
            <a href="index.html" class="nav-btn" style="margin-top:10px;"><i class="fas fa-sign-in-alt"></i> Go to Login</a>
          </div>
        `;
      },

      showErrorState(msg) {
        const container = document.getElementById('ordersList');
        container.innerHTML = `
          <div class="error-state">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>Failed to Load Orders</h3>
            <p>${msg}</p>
            <button class="nav-btn" style="margin-top:10px;" onclick="OrdersApp.loadFromFirestore()">
              <i class="fas fa-redo"></i> Retry
            </button>
          </div>
        `;
      },

      // ===================== FIRESTORE MODE =====================
      loadFromFirestore() {
        if (!this.db) {
          this.loadFromLocalStorage();
          return;
        }

        const container = document.getElementById('ordersList');
        container.innerHTML = `
          <div class="loading-state">
            <i class="fas fa-circle-notch fa-spin"></i>
            <p>Loading orders from cloud...</p>
          </div>
        `;

        // Real-time listener: orders collection ordered by date descending
        this.unsubscribe = this.db.collection('orders')
          .orderBy('date', 'desc')
          .onSnapshot((snapshot) => {
            this.orders = [];
            snapshot.forEach(doc => {
              const data = doc.data();
              // Add Firestore doc ID for deletion
              data._docId = doc.id;
              this.orders.push(data);
            });
            this.renderOrders();
          }, (err) => {
            console.error('[LOVARA Orders] Firestore error:', err);
            if (err.code === 'permission-denied') {
              this.showErrorState('You do not have permission to view orders. Please check your Firestore rules.');
            } else if (err.code === 'failed-precondition') {
              this.showErrorState('Firestore index required. Please create a composite index for "orders" collection ordered by "date".');
            } else {
              this.showErrorState(err.message);
            }
          });
      },

      // ===================== LOCALSTORAGE FALLBACK =====================
      loadFromLocalStorage() {
        this.orders = JSON.parse(localStorage.getItem('lovara_orders')) || [];
        this.renderOrders();
      },

      renderOrders() {
        const container = document.getElementById('ordersList');
        const countBadge = document.getElementById('orderCount');

        countBadge.textContent = `${this.orders.length} Order${this.orders.length !== 1 ? 's' : ''}`;

        if (this.orders.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-clipboard-list"></i>
              <h3>No Orders Yet</h3>
              <p>When customers place orders, they will appear here.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = this.orders.map((order, index) => this.renderOrder(order, index)).join('');
      },

      renderOrder(order, index) {
        const dateObj = order.date ? (order.date.toDate ? order.date.toDate() : new Date(order.date)) : new Date();
        const date = dateObj.toLocaleString('en-GB', {
          weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });

        const statusClass = `status-${order.status || 'pending'}`;
        const statusText = (order.status || 'pending').toUpperCase();

        // Customer info (handle both old localStorage shape and Firestore shape)
        const customer = order.customer || {};
        const firstName = customer.firstName || '';
        const lastName = customer.lastName || '';
        const phone = customer.phone || '';
        const email = customer.email || '';
        const address = customer.address || '';
        const city = customer.city || '';
        const country = customer.country || '';
        const postalCode = customer.postalCode || '';
        const notes = customer.notes || '';

        const customerHtml = `
          <div class="customer-box">
            <div class="box-title"><i class="fas fa-user"></i> Customer Details</div>
            <div class="info-grid">
              <div class="info-item">
                <div class="info-label">Full Name</div>
                <div class="info-value highlight">${firstName} ${lastName}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Phone Number</div>
                <div class="info-value phone">${phone}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Email</div>
                <div class="info-value">${email}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Address</div>
                <div class="info-value">${address}${city ? ', ' + city : ''}</div>
              </div>
              <div class="info-item">
                <div class="info-label">Country</div>
                <div class="info-value">${this.getCountryName(country)}</div>
              </div>
              ${postalCode ? `
              <div class="info-item">
                <div class="info-label">Postal Code</div>
                <div class="info-value">${postalCode}</div>
              </div>` : ''}
              ${notes ? `
              <div class="info-item" style="grid-column: 1 / -1;">
                <div class="info-label">Customer Notes</div>
                <div class="info-value" style="font-style:italic;color:var(--text-light);">${notes}</div>
              </div>` : ''}
            </div>
          </div>
        `;

        // Items
        const items = order.items || [];
        const itemsHtml = items.map(item => {
          const itemPrice = parseFloat(item.price) || 0;
          const itemQty = parseInt(item.quantity) || 1;
          return `
            <div class="item-card">
              <img src="${item.imageUrl || item.image || 'https://via.placeholder.com/65x65/c9a87c/ffffff?text=LOVARA'}" 
                   class="item-img" alt="${item.name || 'Product'}" 
                   onerror="this.onerror=null;this.src='https://via.placeholder.com/65x65/c9a87c/ffffff?text=LOVARA';" />
              <div class="item-info">
                <div class="item-name">${item.name || 'Unknown Product'}</div>
                <div class="item-tags">
                  <span class="item-tag"><i class="fas fa-palette"></i> ${item.color || 'N/A'}</span>
                  <span class="item-tag"><i class="fas fa-ruler"></i> ${item.size || 'N/A'}</span>
                  <span class="item-tag"><i class="fas fa-times"></i> Qty: ${itemQty}</span>
                  <span class="item-tag"><i class="fas fa-tag"></i> EGP ${itemPrice.toFixed(2)} each</span>
                </div>
              </div>
              <div class="item-total">EGP ${(itemPrice * itemQty).toFixed(2)}</div>
            </div>
          `;
        }).join('');

        // Payment info
        const payment = order.payment || {};
        const paymentExtra = payment.method !== 'cod' 
          ? `<div class="info-item"><div class="info-label">Transaction ID</div><div class="info-value">${payment.transactionId || '-'}</div></div>` 
          : '';

        // Totals
        const totals = order.totals || {};
        const subtotal = totals.subtotal || 'EGP 0.00';
        const shipping = totals.shipping || 'EGP 0.00';
        const total = totals.total || 'EGP 0.00';

        const phoneClean = phone.replace(/[^0-9+]/g, '');
        const orderNum = order.orderNumber || order._docId || ('ORD-' + index);
        const whatsappLink = `https://wa.me/${phoneClean}?text=Hello%20${encodeURIComponent(firstName)}%2C%20regarding%20your%20LOVARA%20order%20${orderNum}`;

        return `
          <div class="order-card">
            <div class="order-header">
              <div class="order-header-left">
                <div class="order-id">#${orderNum}</div>
                <div class="order-date"><i class="far fa-clock" style="margin-right:5px;"></i>${date}</div>
              </div>
              <div class="order-status ${statusClass}">${statusText}</div>
            </div>

            <div class="order-body">
              ${customerHtml}

              <div class="items-section">
                <div class="box-title"><i class="fas fa-shopping-bag"></i> Ordered Items</div>
                ${itemsHtml}
              </div>

              <div class="info-grid" style="margin-bottom:20px;">
                <div class="info-item">
                  <div class="info-label">Payment Method</div>
                  <div class="info-value">${payment.methodName || payment.method || 'N/A'}</div>
                </div>
                ${paymentExtra}
              </div>

              <div class="totals-box">
                <div class="totals-left">
                  <div class="line">Subtotal: <span>${subtotal}</span></div>
                  <div class="line">Shipping: <span>${shipping}</span></div>
                </div>
                <div class="totals-right">
                  <div class="label">Total Amount</div>
                  <div class="amount">${total}</div>
                </div>
              </div>
            </div>

            <div class="order-actions">
              <button type="button" class="btn btn-delete" onclick="OrdersApp.deleteOrder(${index})">
                <i class="fas fa-trash"></i> Delete Order
              </button>
              <a href="tel:${phoneClean}" class="btn btn-call">
                <i class="fas fa-phone"></i> Call
              </a>
              <a href="${whatsappLink}" class="btn btn-whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i> WhatsApp Customer
              </a>
            </div>
          </div>
        `;
      },

      getCountryName(code) {
        const map = { EG: 'Egypt', SA: 'Saudi Arabia', AE: 'UAE', KW: 'Kuwait', QA: 'Qatar', BH: 'Bahrain', JO: 'Jordan', LB: 'Lebanon', IQ: 'Iraq', OTHER: 'Other' };
        return map[code] || code || 'Unknown';
      },

      deleteOrder(index) {
        if (!confirm('Are you sure you want to delete this order?')) return;

        const order = this.orders[index];
        if (!order) return;

        // If Firestore is available and order has a docId, delete from cloud
        if (this.db && order._docId) {
          this.db.collection('orders').doc(order._docId).delete()
            .then(() => {
              console.log('[LOVARA Orders] Deleted from Firestore:', order._docId);
            })
            .catch(err => {
              console.error('[LOVARA Orders] Delete error:', err);
              alert('Failed to delete order: ' + err.message);
            });
        } else {
          // Fallback: delete from localStorage
          this.orders.splice(index, 1);
          localStorage.setItem('lovara_orders', JSON.stringify(this.orders));
          this.renderOrders();
        }
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => OrdersApp.init());
    } else {
      OrdersApp.init();
    }
  </script>
</body>
</html>
